name: retail_analytics
version: "0.1.0"
config-version: 2
profile: retail_analytics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages", "logs"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Minimum number of orders a product pair must share to appear in mart_basket.
  basket_min_pair_orders: 3
  # Trailing window (days) used for average daily sales in mart_inventory.
  inventory_trailing_days: 28

models:
  retail_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
