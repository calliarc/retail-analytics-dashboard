version: 2

models:
  - name: stg_stores
    description: Typed store attributes.
    columns:
      - name: store_id
        data_tests: [unique, not_null]
      - name: store_format
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["flagship", "standard", "express"]

  - name: stg_products
    description: Typed product catalogue.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: sku
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: &categories
                  ["Grocery", "Beverages", "Household", "Personal Care",
                   "Electronics", "Apparel", "Home & Garden", "Toys"]

  - name: stg_customers
    description: Typed loyalty members.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: home_store_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: loyalty_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ["bronze", "silver", "gold"]

  - name: stg_promotions
    description: Typed promotions.
    columns:
      - name: promo_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: *categories

  - name: stg_orders
    description: Typed order headers.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_date
        data_tests: [not_null]
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: customer_id
        description: Null for guest orders.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: channel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["in_store", "online"]

  - name: stg_order_lines
    description: Typed order lines.
    columns:
      - name: order_line_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: promo_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_promotions')
                field: promo_id
      - name: quantity
        data_tests: [not_null]

  - name: stg_inventory_snapshots
    description: Typed end-of-day inventory positions.
    columns:
      - name: snapshot_date
        data_tests: [not_null]
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
